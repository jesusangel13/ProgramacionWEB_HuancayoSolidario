<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Huancayo Solidario</title>
    <link rel="stylesheet" href="/static/css/register.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Partícula de fondo animada -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="register-card">
            <!-- Logo y título -->
            <div class="header">
                <div class="logo-animation">
                    <div class="logo-circle"></div>
                    <h1>Huancayo Solidario</h1>
                </div>
                <h2>Crea tu cuenta gratis</h2>
                <p>Únete a nuestra comunidad de voluntarios</p>
            </div>

            <!-- Botón de Facebook -->
            <button class="facebook-btn">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M18.896 0H1.104C.494 0 0 .494 0 1.104v17.793C0 19.506.494 20 1.104 20h9.58v-7.745H8.076V9.237h2.606V7.01c0-2.583 1.578-3.99 3.883-3.99 1.104 0 2.052.082 2.329.119v2.7h-1.598c-1.254 0-1.496.597-1.496 1.47v1.928h2.989l-.39 3.018h-2.6V20h5.098c.608 0 1.102-.494 1.102-1.104V1.104C20 .494 19.506 0 18.896 0z"/>
                </svg>
                Continuar con Facebook
            </button>

            <div class="divider">
                <span>o regístrate con email</span>
            </div>

            <!-- Formulario de registro -->
            <form class="register-form" id="registerForm">
                <div class="form-group">
                    <div class="input-group">
                        <input type="text" id="username" name="username" required>
                        <label for="username">Usuario *</label>
                        <div class="input-highlight"></div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <input type="email" id="email" name="email" required>
                        <label for="email">Correo electrónico *</label>
                        <div class="input-highlight"></div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <input type="password" id="password" name="password" required>
                        <label for="password">Contraseña *</label>
                        <div class="input-highlight"></div>
                        <button type="button" class="toggle-password">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                        <label for="confirmPassword">Confirmar contraseña *</label>
                        <div class="input-highlight"></div>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        Al seleccionar esta casilla aceptas nuestro 
                        <a href="#">aviso de privacidad</a> y los 
                        <a href="#">términos y condiciones</a>
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    <span class="btn-text">Crear Cuenta</span>
                    <div class="btn-loader">
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                    </div>
                </button>
            </form>

            <div class="login-link">
                ¿Ya tienes una cuenta? <a href="/login">Iniciar Sesión</a>
            </div>
        </div>

        <!-- Mensaje de éxito -->
        <div class="success-message" id="successMessage">
            <div class="success-icon">✓</div>
            <h3>¡Registro Exitoso!</h3>
            <p>Tu cuenta ha sido creada correctamente</p>
            <button onclick="redirectToLogin()">Continuar al Login</button>
        </div>
    </div>

    <script src="/static/script/register.js"></script>
</body>
</html>
